name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker (unit, offline quality gate, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: pip install -e 'worker[dev,tiktoken]'
      - name: Unit tests and offline retrieval quality gate (§7.3)
        working-directory: worker
        run: pytest -q -m 'not integration'
      - name: Integration tests (Testcontainers Postgres + pgvector, Redis)
        working-directory: worker
        run: pytest -q -m integration

  api:
    name: api (unit, WireMock contract, Testcontainers integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: api
        run: ./mvnw -B verify -Pintegration

  e2e:
    name: end-to-end + live quality gate
    runs-on: ubuntu-latest
    needs: [worker, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'worker[dev]' httpx
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: End-to-end checks (upload → INDEXED → answer, NO_ANSWER, dead-letter)
        run: python scripts/e2e.py
      - name: Retrieval quality gate against the live stack
        run: python scripts/eval_gate.py
      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color api worker | tail -n 400
