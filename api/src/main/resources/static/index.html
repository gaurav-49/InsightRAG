<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightRAG Console</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #2f5d8a; --ok: #2e7d4f; --warn: #a15c00; --bad: #b3261e; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29c; --line: #34332f;
            --accent: #8fb6de; --ok: #6cc38f; --warn: #e0a34a; --bad: #f08a80; --chip: #2a2f35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 3fr 2fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  textarea, input[type=text] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .answer { white-space: pre-wrap; margin-top: 12px; min-height: 1.5em; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 12px; margin-right: 6px; }
  .ANSWERED { color: var(--ok); } .NO_ANSWER { color: var(--warn); } .DEGRADED, .FAILED { color: var(--bad); }
  .INDEXED { color: var(--ok); } .QUEUED, .PROCESSING { color: var(--warn); }
  ol.cites { padding-left: 20px; margin: 8px 0 0; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td.INDEXED, td.QUEUED, td.PROCESSING, td.FAILED { white-space: nowrap; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  .error { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>InsightRAG</h1>
  <span class="muted" id="health">checking…</span>
  <span class="spacer"></span>
  <button class="secondary" id="devToken" title="Development only: mints a local token">Get dev token</button>
</header>
<main>
  <section>
    <h2>Ask the corpus</h2>
    <textarea id="question" placeholder="e.g. What is the notice period for a level L5 engineer?"></textarea>
    <div class="row">
      <button id="ask">Ask</button>
      <label class="muted"><input type="checkbox" id="stream" checked> stream</label>
      <span class="muted" id="meta"></span>
    </div>
    <div class="answer" id="answer"></div>
    <ol class="cites" id="citations"></ol>
    <div class="error" id="askError"></div>
  </section>
  <section>
    <h2>Corpus</h2>
    <input type="file" id="file" accept=".pdf,.docx,.txt,.md,.markdown">
    <div class="row">
      <input type="text" id="source" placeholder="source label (optional)" style="flex:1; min-width: 120px">
      <button id="upload">Upload</button>
      <button class="secondary" id="refresh">Refresh</button>
    </div>
    <div class="error" id="docError"></div>
    <table><thead><tr><th>Document</th><th>Status</th><th>Chunks</th></tr></thead><tbody id="docs"></tbody></table>
  </section>
  <section style="grid-column: 1 / -1">
    <h2>Access token</h2>
    <textarea id="token" placeholder="Paste a JWT with scope 'query' (and 'admin' to upload)"></textarea>
    <p class="muted">Kept in this browser's session storage only.</p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } },
                set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
$("token").value = store.get("insightrag.token");
$("token").addEventListener("change", () => store.set("insightrag.token", $("token").value.trim()));
const auth = () => ({ Authorization: "Bearer " + $("token").value.trim() });
const text = (el, s) => { el.textContent = s; };

async function problem(r) {
  try { const p = await r.json(); return p.detail || p.message || r.statusText; } catch { return r.statusText; }
}

async function health() {
  try {
    const r = await fetch("/api/v1/health"); const h = await r.json();
    text($("health"), `status ${h.status} · embeddings ${h.dependencies.embedding.model} · llm ${h.dependencies.llm.provider}`);
  } catch { text($("health"), "API unreachable"); }
}

$("devToken").onclick = async () => {
  const r = await fetch("/api/v1/auth/dev-token", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ scopes: ["query", "admin"] }) });
  if (!r.ok) { text($("askError"), "Dev tokens are disabled on this server; paste a token instead."); return; }
  $("token").value = (await r.json()).accessToken; store.set("insightrag.token", $("token").value); loadDocs();
};

function showCitations(cites) {
  const ol = $("citations"); ol.replaceChildren();
  for (const c of cites || []) {
    const li = document.createElement("li");
    li.value = c.ref;
    const where = c.page != null ? `p.${c.page}` : (c.section ? `“${c.section}”` : `chunk ${c.chunkId}`);
    li.textContent = `${c.document}, ${where} — score ${c.score}`;
    ol.appendChild(li);
  }
}

function showDone(d) {
  $("meta").replaceChildren();
  const s = document.createElement("span"); s.className = "chip " + d.status; s.textContent = d.status;
  const t = document.createElement("span"); t.className = "chip"; t.textContent = `${d.cacheTier} · ${d.latencyMs} ms`;
  $("meta").append(s, t);
  if (d.reason) text($("askError"), d.reason);
}

$("ask").onclick = async () => {
  const q = $("question").value.trim(); if (!q) return;
  text($("answer"), ""); text($("askError"), ""); showCitations([]); $("meta").replaceChildren();
  $("ask").disabled = true;
  try {
    if (!$("stream").checked) {
      const r = await fetch("/api/v1/query", { method: "POST", headers: { ...auth(), "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }) });
      if (!r.ok) { text($("askError"), await problem(r)); return; }
      const a = await r.json();
      text($("answer"), a.answer || ""); showCitations(a.citations); showDone(a);
      return;
    }
    const r = await fetch("/api/v1/query/stream", { method: "POST",
      headers: { ...auth(), "Content-Type": "application/json", Accept: "text/event-stream" }, body: JSON.stringify({ question: q }) });
    if (!r.ok) { text($("askError"), await problem(r)); return; }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event:(.*)$/m) || [])[1]?.trim();
        const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5)).join("\n");
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        if (ev === "meta") showCitations(d.citations);
        else if (ev === "token") $("answer").textContent += d.text;
        else if (ev === "done") { showDone(d); if (d.citations) showCitations(d.citations); }
        else if (ev === "error") text($("askError"), d.message);
      }
    }
  } catch (e) { text($("askError"), String(e)); }
  finally { $("ask").disabled = false; }
};

async function loadDocs() {
  text($("docError"), "");
  const r = await fetch("/api/v1/documents?size=50", { headers: auth() });
  if (!r.ok) { text($("docError"), r.status === 401 ? "Add a token to list documents." : await problem(r)); return; }
  const page = await r.json(); const tb = $("docs"); tb.replaceChildren();
  for (const d of page.items) {
    const tr = document.createElement("tr");
    const name = document.createElement("td"); name.textContent = d.filename;
    if (d.failureReason) { const m = document.createElement("div"); m.className = "muted"; m.textContent = d.failureReason; name.appendChild(m); }
    const st = document.createElement("td"); st.className = d.status; st.textContent = d.status;
    const ch = document.createElement("td"); ch.textContent = d.chunkCount;
    tr.append(name, st, ch); tb.appendChild(tr);
  }
}

$("upload").onclick = async () => {
  const f = $("file").files[0]; if (!f) return;
  const form = new FormData(); form.append("file", f);
  const src = $("source").value.trim();
  const r = await fetch("/api/v1/documents" + (src ? "?source=" + encodeURIComponent(src) : ""), { method: "POST", headers: auth(), body: form });
  if (!r.ok) { text($("docError"), await problem(r)); return; }
  const u = await r.json();
  text($("docError"), u.duplicate ? "Already uploaded — existing document returned." : "");
  loadDocs(); setTimeout(loadDocs, 3000);
};
$("refresh").onclick = loadDocs;

health(); if ($("token").value) loadDocs();
</script>
</body>
</html>
